<!DOCTYPE html>
<html>
<head>
    <title>FluxGroups</title>
    <meta charset="UTF-8">
    <style>
        body {
            background: #0a0a0f;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        h1 {
            font-size: 4rem;
            background: linear-gradient(135deg, #3B82F6, #EF4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .ip {
            color: #60A5FA;
            font-size: 1.2rem;
        }
        .creators {
            color: #888;
            font-size: 1rem;
        }
        .creators span {
            color: #F87171;
        }
    </style>
</head>
<body>
    <h1>⚡ FLUX GROUPS</h1>
    <p class="ip">⚡ play.fluxsmp.fun</p>
    <p class="creators">Created by <span>Akshat</span> &amp; <span>Huzaifa</span> ❤️</p>
</body>
</html>
